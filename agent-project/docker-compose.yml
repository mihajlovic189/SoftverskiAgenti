networks:
  fl-network:
    driver: bridge

volumes:
  agg-state1:
  agg-state2:

services:
  aggregator1:
    build: .
    container_name: fl-aggregator1
    networks:
      - fl-network
    command: ["--role=aggregator", "--listen-addr=0.0.0.0:8080", "--public-addr=aggregator1:8080", "--seeds=aggregator1:8080,aggregator2:8081", "--expected-nodes=4", "--state-file=/app/state/aggregator_state.json"]
    volumes:
      - agg-state1:/app/state
    ports:
      - "8080:8080"

  aggregator2:
    build: .
    container_name: fl-aggregator2
    networks:
      - fl-network
    command: ["--role=aggregator", "--listen-addr=0.0.0.0:8081", "--public-addr=aggregator2:8081", "--seeds=aggregator1:8080,aggregator2:8081", "--expected-nodes=4", "--state-file=/app/state/aggregator_state.json"]
    volumes:
      - agg-state2:/app/state
    ports:
      - "8081:8081"

  trainer1:
    build: .
    container_name: fl-trainer1
    networks:
      - fl-network
    depends_on:
      - aggregator1
      - aggregator2
    command: ["--role=trainer", "--file=data/node1.json", "--listen-addr=0.0.0.0:9090", "--public-addr=trainer1:9090", "--seeds=aggregator1:8080,aggregator2:8081"]

  trainer2:
    build: .
    container_name: fl-trainer2
    networks:
      - fl-network
    depends_on:
      - aggregator1
      - aggregator2
    command: ["--role=trainer", "--file=data/node2.json", "--listen-addr=0.0.0.0:9091", "--public-addr=trainer2:9091", "--seeds=aggregator1:8080,aggregator2:8081"]

  trainer3:
    build: .
    container_name: fl-trainer3
    networks:
      - fl-network
    depends_on:
      - aggregator1
      - aggregator2
    command: ["--role=trainer", "--file=data/node3.json", "--listen-addr=0.0.0.0:9092", "--public-addr=trainer3:9092", "--seeds=aggregator1:8080,aggregator2:8081"]

  trainer4:
    build: .
    container_name: fl-trainer4
    networks:
      - fl-network
    depends_on:
      - aggregator1
      - aggregator2
    command: ["--role=trainer", "--file=data/node4.json", "--listen-addr=0.0.0.0:9093", "--public-addr=trainer4:9093", "--seeds=aggregator1:8080,aggregator2:8081"]
